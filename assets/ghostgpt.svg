<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ggBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080d"/>
      <stop offset="100%" stop-color="#121020"/>
    </linearGradient>
    <linearGradient id="ggAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ggGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="ggGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ggBg)" rx="16"/>

  <!-- Glowing atmospheric gradients -->
  <circle cx="680" cy="180" r="160" fill="#8b5cf6" opacity="0.18" filter="url(#ggGlow)"/>
  <circle cx="150" cy="380" r="140" fill="#6366f1" opacity="0.15" filter="url(#ggGlow)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser header -->
  <rect x="35" y="30" width="730" height="42" rx="10" fill="#141322" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="58" cy="51" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="74" cy="51" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="90" cy="51" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="230" y="40" width="340" height="22" rx="6" fill="#0b0a16" stroke="rgba(255,255,255,0.06)"/>
  <text x="360" y="55" fill="#716c96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">pravin-kumar-295.github.io/GhostGPT</text>

  <!-- Chat Application Frame -->
  <g transform="translate(35, 85)">
    <!-- Sidebar -->
    <rect x="0" y="0" width="180" height="375" rx="10" fill="#100f1c" stroke="rgba(255,255,255,0.06)"/>
    
    <!-- Ghost Logo -->
    <g transform="translate(20, 20)">
      <circle cx="16" cy="16" r="16" fill="url(#ggAccent)"/>
      <!-- Ghost icon vector -->
      <path d="M11 22 C11 14 21 14 21 22 C21 24 19 24 18 22 C17 24 15 24 14 22 C13 24 11 24 11 22 Z M13 16 A1.5 1.5 0 1 0 13 13 A1.5 1.5 0 1 0 13 16 M19 16 A1.5 1.5 0 1 0 19 13 A1.5 1.5 0 1 0 19 16" fill="#ffffff"/>
      <text x="40" y="21" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Ghost<tspan fill="#a78bfa">GPT</tspan></text>
    </g>

    <!-- New Chat button -->
    <rect x="15" y="65" width="150" height="34" rx="8" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.3)"/>
    <text x="90" y="86" fill="#c4b5fd" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">+ New Chat Session</text>

    <!-- Chat history list -->
    <g transform="translate(15, 115)">
      <rect x="0" y="0" width="150" height="28" rx="6" fill="#18162d"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11">🚀 Modern Web Dev</text>

      <text x="12" y="52" fill="#71717a" font-family="sans-serif" font-size="11">✨ Tailwind UI Components</text>
      <text x="12" y="84" fill="#71717a" font-family="sans-serif" font-size="11">⚡ JavaScript Async Loops</text>
      <text x="12" y="116" fill="#71717a" font-family="sans-serif" font-size="11">🐍 Python Automation</text>
      <text x="12" y="148" fill="#71717a" font-family="sans-serif" font-size="11">💡 UI/UX Glassmorphism</text>
    </g>

    <!-- Chat Main Body -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="535" height="375" rx="10" fill="#100f1e" stroke="rgba(255,255,255,0.06)"/>

      <!-- User Message -->
      <g transform="translate(120, 25)">
        <rect x="0" y="0" width="395" height="42" rx="12" fill="url(#ggAccent)"/>
        <text x="20" y="26" fill="#ffffff" font-family="sans-serif" font-size="12">How do I build a smooth, high-converting hero section in React?</text>
      </g>

      <!-- Bot Message -->
      <g transform="translate(20, 85)">
        <circle cx="16" cy="16" r="16" fill="url(#ggAccent)"/>
        <!-- Mini ghost -->
        <path d="M12 20 C12 14 20 14 20 20 C20 22 18 22 17 20 C16 22 15 22 14 20 C13 22 12 22 12 20 Z" fill="#ffffff"/>
        
        <g transform="translate(42, 0)">
          <rect x="0" y="0" width="453" height="215" rx="12" fill="#17152c" stroke="rgba(255,255,255,0.06)"/>
          <text x="20" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="12">Here is a proven 3-layer architecture for a modern SaaS hero section:</text>
          
          <!-- Code Block inside Bot message -->
          <rect x="18" y="44" width="417" height="115" rx="8" fill="#0d0c18" stroke="rgba(255,255,255,0.06)"/>
          <circle cx="34" cy="60" r="3" fill="#ef4444"/>
          <circle cx="44" cy="60" r="3" fill="#f59e0b"/>
          <circle cx="54" cy="60" r="3" fill="#10b981"/>
          <text x="75" y="62" fill="#64748b" font-family="monospace" font-size="10">HeroSection.jsx</text>
          
          <text x="30" y="85" fill="#f43f5e" font-family="monospace" font-size="11">export const <tspan fill="#38bdf8">Hero</tspan> = () =&gt; {</text>
          <text x="45" y="105" fill="#a78bfa" font-family="monospace" font-size="11">return (</text>
          <text x="60" y="125" fill="#fcd34d" font-family="monospace" font-size="11">&lt;div className="relative overflow-hidden bg-radial"&gt;</text>
          <text x="75" y="145" fill="#34d399" font-family="monospace" font-size="11">&lt;h1 className="text-gradient"&gt;Modern Web Experiences&lt;/h1&gt;</text>

          <text x="20" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">Focus on semantic hierarchy, responsive typography, and subtle dark glows.</text>
          <circle cx="410" cy="182" r="3" fill="#8b5cf6"/>
          <circle cx="418" cy="182" r="3" fill="#8b5cf6" opacity="0.6"/>
          <circle cx="426" cy="182" r="3" fill="#8b5cf6" opacity="0.3"/>
        </g>
      </g>

      <!-- Chat Input Box -->
      <g transform="translate(20, 315)">
        <rect x="0" y="0" width="495" height="44" rx="22" fill="#17152c" stroke="rgba(139, 92, 246, 0.4)"/>
        <text x="24" y="27" fill="#71717a" font-family="sans-serif" font-size="12">Type your message to GhostGPT...</text>
        <circle cx="465" cy="22" r="16" fill="url(#ggAccent)"/>
        <path d="M460 22 L468 18 L468 26 Z" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>