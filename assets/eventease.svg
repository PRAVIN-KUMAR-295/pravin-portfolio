<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d18"/>
      <stop offset="100%" stop-color="#141328"/>
    </linearGradient>
    <linearGradient id="eeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="eeAiBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="eeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#eeBg)" rx="16"/>

  <!-- Glowing accents -->
  <circle cx="700" cy="120" r="150" fill="#ec4899" opacity="0.14" filter="url(#eeGlow)"/>
  <circle cx="150" cy="400" r="160" fill="#8b5cf6" opacity="0.16" filter="url(#eeGlow)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Browser header -->
  <rect x="35" y="30" width="730" height="42" rx="10" fill="#16152a" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="58" cy="51" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="74" cy="51" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="90" cy="51" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="230" y="40" width="340" height="22" rx="6" fill="#0d0c1c" stroke="rgba(255,255,255,0.06)"/>
  <text x="360" y="55" fill="#787396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">resilient-mermaid-13cf3c.netlify.app</text>

  <!-- Application Canvas -->
  <g transform="translate(35, 85)">
    <!-- Top Nav of App -->
    <rect x="0" y="0" width="730" height="50" rx="10" fill="#141326" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="28" cy="25" r="12" fill="url(#eeAccent)"/>
    <path d="M22 25 L34 25 M28 19 L28 31" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="30" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">EventEase <tspan fill="#a78bfa">AI</tspan></text>

    <!-- Nav links -->
    <text x="210" y="30" fill="#a78bfa" font-family="sans-serif" font-weight="600" font-size="12">Explore Events</text>
    <text x="320" y="30" fill="#71717a" font-family="sans-serif" font-size="12">Schedule</text>
    <text x="400" y="30" fill="#71717a" font-family="sans-serif" font-size="12">AI Assistant</text>
    <text x="500" y="30" fill="#71717a" font-family="sans-serif" font-size="12">RSVP Manager</text>

    <rect x="625" y="10" width="92" height="30" rx="6" fill="url(#eeAccent)"/>
    <text x="671" y="29" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">+ Host Event</text>

    <!-- AI Banner -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="730" height="74" rx="10" fill="#181632" stroke="rgba(139, 92, 246, 0.25)"/>
      <rect x="20" y="16" width="70" height="20" rx="10" fill="url(#eeAiBadge)"/>
      <text x="55" y="30" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">AI COPILOT</text>
      <text x="100" y="30" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13">Smart Event Planner Active</text>
      <text x="20" y="54" fill="#a1a1aa" font-family="sans-serif" font-size="11">Automated attendee clustering, optimal session scheduling, and smart venue recommendations.</text>
      <rect x="610" y="22" width="105" height="30" rx="6" fill="#242145" stroke="rgba(255,255,255,0.1)"/>
      <text x="662" y="41" fill="#c4b5fd" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Ask Assistant</text>
    </g>

    <!-- Event Cards Grid -->
    <g transform="translate(0, 148)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="232" height="225" rx="10" fill="#131224" stroke="rgba(255,255,255,0.06)"/>
      <rect x="0" y="0" width="232" height="95" rx="10" fill="#1f1b3d"/>
      <!-- Decorative vector inside card header -->
      <circle cx="180" cy="48" r="30" fill="#8b5cf6" opacity="0.3"/>
      <rect x="14" y="14" width="62" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
      <text x="45" y="27" fill="#10b981" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">CONFIRMED</text>
      <text x="14" y="122" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">DevCon Hackathon 2026</text>
      <text x="14" y="142" fill="#a1a1aa" font-family="sans-serif" font-size="10">📍 Virtual &amp; Hybrid Event</text>
      <text x="14" y="160" fill="#71717a" font-family="sans-serif" font-size="10">👥 480+ Registrations</text>
      <rect x="14" y="180" width="204" height="32" rx="6" fill="url(#eeAccent)"/>
      <text x="116" y="200" fill="#ffffff" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Manage Event</text>

      <!-- Card 2 -->
      <rect x="249" y="0" width="232" height="225" rx="10" fill="#131224" stroke="rgba(255,255,255,0.06)"/>
      <rect x="249" y="0" width="232" height="95" rx="10" fill="#241b34"/>
      <circle cx="429" cy="48" r="30" fill="#ec4899" opacity="0.25"/>
      <rect x="263" y="14" width="70" height="18" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b"/>
      <text x="298" y="27" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">UPCOMING</text>
      <text x="263" y="122" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">AI Web Innovation Summit</text>
      <text x="263" y="142" fill="#a1a1aa" font-family="sans-serif" font-size="10">📍 Keynote Stage 1</text>
      <text x="263" y="160" fill="#71717a" font-family="sans-serif" font-size="10">👥 320 Attendees</text>
      <rect x="263" y="180" width="204" height="32" rx="6" fill="#242145" stroke="rgba(255,255,255,0.1)"/>
      <text x="365" y="200" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">View Details</text>

      <!-- Card 3 -->
      <rect x="498" y="0" width="232" height="225" rx="10" fill="#131224" stroke="rgba(255,255,255,0.06)"/>
      <rect x="498" y="0" width="232" height="95" rx="10" fill="#171e36"/>
      <circle cx="678" cy="48" r="30" fill="#06b6d4" opacity="0.3"/>
      <rect x="512" y="14" width="72" height="18" rx="4" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6"/>
      <text x="548" y="27" fill="#60a5fa" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">PLANNING</text>
      <text x="512" y="122" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Frontend Design Workshop</text>
      <text x="512" y="142" fill="#a1a1aa" font-family="sans-serif" font-size="10">📍 Hands-on Lab Session</text>
      <text x="512" y="160" fill="#71717a" font-family="sans-serif" font-size="10">👥 150 Seats Limited</text>
      <rect x="512" y="180" width="204" height="32" rx="6" fill="#242145" stroke="rgba(255,255,255,0.1)"/>
      <text x="614" y="200" fill="#e2e8f0" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">View Details</text>
    </g>
  </g>
</svg>