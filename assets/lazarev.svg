<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070908"/>
      <stop offset="60%" stop-color="#0c110d"/>
      <stop offset="100%" stop-color="#080c09"/>
    </linearGradient>

    <!-- Neon Green Accents -->
    <linearGradient id="lzNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="lzCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a15"/>
      <stop offset="100%" stop-color="#0d120f"/>
    </linearGradient>

    <filter id="lzGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#lzBg)" rx="16"/>

  <!-- Ambient Neon Green & Cyan Glow Orbs -->
  <circle cx="720" cy="110" r="150" fill="#00ff88" opacity="0.12" filter="url(#lzGlow)"/>
  <circle cx="100" cy="420" r="160" fill="#10b981" opacity="0.10" filter="url(#lzGlow)"/>
  <circle cx="450" cy="260" r="120" fill="#06b6d4" opacity="0.06" filter="url(#lzGlow)"/>

  <!-- Subtle Perspective Cyber Grid -->
  <g opacity="0.06" stroke="#00ff88" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Browser Chrome / Frame -->
  <rect x="35" y="28" width="730" height="42" rx="10" fill="#111613" stroke="rgba(0, 255, 136, 0.2)"/>
  <circle cx="58" cy="49" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="74" cy="49" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="90" cy="49" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="230" y="38" width="340" height="22" rx="6" fill="#0a0e0b" stroke="rgba(255,255,255,0.06)"/>
  <text x="360" y="53" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">pravin-kumar-295.github.io/LAZAREV-project</text>

  <!-- Agency Content Canvas -->
  <g transform="translate(35, 82)">
    
    <!-- Top Agency Navigation Bar -->
    <rect x="0" y="0" width="730" height="52" rx="10" fill="#0e1410" stroke="rgba(0, 255, 136, 0.15)"/>
    
    <!-- Brand Mark -->
    <g transform="translate(24, 16)">
      <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#lzNeonGrad)"/>
      <path d="M5 5 H9 V15 H15 V11" fill="none" stroke="#070908" stroke-width="2.5" stroke-linecap="round"/>
      <text x="30" y="16" fill="#ffffff" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" letter-spacing="1.5">LAZAREV<tspan fill="#00ff88">.</tspan></text>
    </g>

    <!-- Nav Items -->
    <text x="260" y="31" fill="#00ff88" font-family="sans-serif" font-weight="600" font-size="11" letter-spacing="0.5">Case Studies</text>
    <text x="360" y="31" fill="#94a3b8" font-family="sans-serif" font-size="11">Services</text>
    <text x="440" y="31" fill="#94a3b8" font-family="sans-serif" font-size="11">About Agency</text>
    <text x="540" y="31" fill="#94a3b8" font-family="sans-serif" font-size="11">Insights</text>

    <!-- CTA Button -->
    <rect x="625" y="11" width="92" height="30" rx="15" fill="#00ff88" opacity="0.15" stroke="#00ff88" stroke-width="1.2"/>
    <text x="671" y="30" fill="#00ff88" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">LET'S TALK ↗</text>

    <!-- Hero Headline & Agency Banner -->
    <g transform="translate(24, 72)">
      <!-- Category Tag -->
      <rect x="0" y="0" width="165" height="22" rx="11" fill="rgba(0, 255, 136, 0.12)" stroke="rgba(0, 255, 136, 0.4)"/>
      <circle cx="12" cy="11" r="3.5" fill="#00ff88"/>
      <text x="22" y="15" fill="#6ee7b7" font-family="sans-serif" font-weight="700" font-size="9" letter-spacing="0.8">DIGITAL PRODUCT AGENCY</text>

      <!-- Main Headline -->
      <text x="0" y="55" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">
        WE DESIGN <tspan fill="#00ff88" filter="url(#neonPulse)">NEXT-GEN</tspan> DIGITAL
      </text>
      <text x="0" y="88" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">
        PRODUCTS &amp; BRANDS.
      </text>

      <!-- Subtitle -->
      <text x="0" y="116" fill="#9ca3af" font-family="sans-serif" font-size="12">
        Award-winning design and technology agency crafting high-conversion digital experiences.
      </text>
    </g>

    <!-- Right Side: Interactive Agency Feature Showreel Mockup -->
    <g transform="translate(470, 72)">
      <rect x="0" y="0" width="236" height="135" rx="12" fill="url(#lzCardGrad)" stroke="rgba(0, 255, 136, 0.3)"/>
      <circle cx="118" cy="67" r="28" fill="rgba(0, 255, 136, 0.18)" stroke="#00ff88" stroke-width="1.5"/>
      <polygon points="113,56 128,67 113,78" fill="#00ff88"/>
      <text x="118" y="112" fill="#e5e7eb" font-family="sans-serif" font-weight="600" font-size="10" text-anchor="middle">SHOWREEL 2026</text>
    </g>

    <!-- Agency Showcase Cards Grid (Bottom) -->
    <g transform="translate(0, 222)">
      
      <!-- Card 1 -->
      <rect x="0" y="0" width="228" height="155" rx="10" fill="#0d130f" stroke="rgba(0, 255, 136, 0.25)"/>
      <rect x="0" y="0" width="228" height="75" rx="10" fill="#131c15"/>
      <!-- Decorative UI lines -->
      <circle cx="195" cy="38" r="24" fill="#00ff88" opacity="0.15"/>
      <rect x="14" y="14" width="78" height="18" rx="4" fill="rgba(0, 255, 136, 0.2)" stroke="#00ff88"/>
      <text x="53" y="27" fill="#00ff88" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">FINTECH UI</text>
      
      <text x="14" y="104" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13">Nova Capital Platform</text>
      <text x="14" y="122" fill="#9ca3af" font-family="sans-serif" font-size="10">Web App &amp; Design System</text>
      <text x="14" y="142" fill="#00ff88" font-family="sans-serif" font-weight="700" font-size="10">VIEW CASE STUDY ↗</text>

      <!-- Card 2 -->
      <rect x="251" y="0" width="228" height="155" rx="10" fill="#0d130f" stroke="rgba(0, 255, 136, 0.15)"/>
      <rect x="251" y="0" width="228" height="75" rx="10" fill="#111814"/>
      <circle cx="446" cy="38" r="24" fill="#06b6d4" opacity="0.2"/>
      <rect x="265" y="14" width="74" height="18" rx="4" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4"/>
      <text x="302" y="27" fill="#67e8f9" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">AI ROBOTICS</text>
      
      <text x="265" y="104" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13">Synapse AI Hardware</text>
      <text x="265" y="122" fill="#9ca3af" font-family="sans-serif" font-size="10">Interactive 3D Experience</text>
      <text x="265" y="142" fill="#00ff88" font-family="sans-serif" font-weight="700" font-size="10">VIEW CASE STUDY ↗</text>

      <!-- Card 3 -->
      <rect x="502" y="0" width="228" height="155" rx="10" fill="#0d130f" stroke="rgba(0, 255, 136, 0.15)"/>
      <rect x="502" y="0" width="228" height="75" rx="10" fill="#131c15"/>
      <circle cx="697" cy="38" r="24" fill="#10b981" opacity="0.2"/>
      <rect x="516" y="14" width="82" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981"/>
      <text x="557" y="27" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="9" text-anchor="middle">E-COMMERCE</text>
      
      <text x="516" y="104" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13">Aether Sound Luxury</text>
      <text x="516" y="122" fill="#9ca3af" font-family="sans-serif" font-size="10">Brand Identity &amp; Store</text>
      <text x="516" y="142" fill="#00ff88" font-family="sans-serif" font-weight="700" font-size="10">VIEW CASE STUDY ↗</text>

    </g>

  </g>
</svg>