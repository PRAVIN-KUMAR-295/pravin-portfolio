<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="innerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <filter id="avatarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient outer glow -->
  <circle cx="160" cy="160" r="140" fill="url(#avatarGrad)" opacity="0.25" filter="url(#avatarGlow)"/>

  <!-- Outer gradient border ring -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="url(#avatarGrad)" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Main circle base -->
  <circle cx="160" cy="160" r="136" fill="url(#innerBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- Code elements in background -->
  <text x="65" y="110" fill="#8b5cf6" font-family="monospace" font-size="16" opacity="0.4">&lt;dev&gt;</text>
  <text x="220" y="210" fill="#3b82f6" font-family="monospace" font-size="16" opacity="0.4">&lt;/code&gt;</text>
  <text x="75" y="230" fill="#06b6d4" font-family="monospace" font-size="14" opacity="0.3">{ UI / UX }</text>

  <!-- Stylized Tech Developer Silhouette / Character -->
  <g transform="translate(160, 160)">
    <!-- Shoulders / Torso -->
    <path d="M-65 110 C-65 65, -35 55, 0 55 C35 55, 65 65, 65 110 Z" fill="#1e2238" stroke="rgba(139, 92, 246, 0.5)" stroke-width="2"/>
    
    <!-- Laptop glow -->
    <path d="M-50 95 L50 95 L40 120 L-40 120 Z" fill="#2d3352" stroke="url(#avatarGrad)" stroke-width="2"/>
    <polygon points="-38,98 38,98 32,112 -32,112" fill="#8b5cf6" opacity="0.4"/>

    <!-- Neck -->
    <rect x="-16" y="22" width="32" height="30" rx="4" fill="#33395c"/>

    <!-- Head / Face -->
    <ellipse cx="0" cy="10" rx="36" ry="42" fill="#3d446b"/>

    <!-- Hair -->
    <path d="M-38 6 C-38 -34, 38 -34, 38 6 C38 -15, 20 -28, 0 -28 C-20 -28, -35 -15, -38 6 Z" fill="#181a29"/>

    <!-- Sleek Tech Glasses -->
    <rect x="-30" y="2" width="26" height="15" rx="4" fill="rgba(14, 165, 233, 0.25)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="4" y="2" width="26" height="15" rx="4" fill="rgba(14, 165, 233, 0.25)" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-4" y1="9" x2="4" y2="9" stroke="#38bdf8" stroke-width="2"/>

    <!-- Smile -->
    <path d="M-10 26 Q0 34 10 26" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Tech Mini Badges -->
  <g transform="translate(45, 55)">
    <circle cx="20" cy="20" r="18" fill="#171b2e" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="25" fill="#f97316" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle">HTML</text>
  </g>

  <g transform="translate(235, 60)">
    <circle cx="20" cy="20" r="18" fill="#171b2e" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="25" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle">CSS</text>
  </g>

  <g transform="translate(250, 195)">
    <circle cx="20" cy="20" r="18" fill="#171b2e" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="25" fill="#facc15" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle">JS</text>
  </g>

  <g transform="translate(30, 195)">
    <circle cx="20" cy="20" r="18" fill="#171b2e" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="25" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" text-anchor="middle">⚛</text>
  </g>
</svg>